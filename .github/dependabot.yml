version: 2

# Version updates arrive grouped: one PR per ecosystem per week, minor and
# patch only. Major versions are ignored here and taken deliberately.
#
# They were paused (open-pull-requests-limit: 0) while main's root commit was
# still being rewritten before launch: a rewritten branch shares no ancestor
# with an open PR, so GitHub closes it, and two rewrites closed 46 Dependabot
# PRs. main is now protected — no force pushes — so the limits are back.
#
# This does not affect Dependabot SECURITY updates, which are driven by
# Dependabot alerts and are not subject to open-pull-requests-limit.

updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"

  # Docker base images — every Dockerfile we build and publish. The frontend
  # and postgres images ship in every release (ghcr.io/<owner>/madrona-*)
  # but were not watched, so their base images' fixes went unseen. Majors are
  # ignored like everywhere else: node:24 must also match frontend/.nvmrc
  # (src/test/nodeVersion.test.ts), and pg16 is the database's major version.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
      - "/docker/postgres"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "ci"
