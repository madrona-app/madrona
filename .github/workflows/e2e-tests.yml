    name: Visual Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only run visual regression tests on specific label or manual trigger
    if: contains(github.event.pull_request.labels.*.name, 'visual-test') || github.event_name == 'workflow_dispatch'

