# -----------------------------------------------------------------------------
# Real client address.
#
# $proxy_add_x_forwarded_for APPENDS to whatever the client sent, and the app
# reads the LEFTMOST entry, so any client could name its own IP by sending an
# X-Forwarded-For header. Every IP-keyed rate limit in the backend (global
# read/write, visitor Guide LLM, password reset, email verification resend, MFA
# recovery) keyed off that value, so a fresh bucket was one header away.
#
# The fix has two halves:
#
#   1. We OVERWRITE X-Forwarded-For with $remote_addr instead of appending.
#   2. $remote_addr is only rewritten from the forwarded chain for peers listed
#      in MADRONA_TRUSTED_PROXIES, which DEFAULTS TO EMPTY — trusting nobody.
#
# The default matters. Trusting the RFC1918 ranges looks reasonable and is
# wrong for this deployment: in the compose stack the browser reaches nginx
# from a bridge network in 172.16.0.0/12, so "trust private ranges" trusts the
# client, and a forged header sails straight through. Verified by sending
# `X-Forwarded-For: 1.2.3.4, 5.6.7.8` through a trusted-private-ranges build:
# the backend received 5.6.7.8, an address the client chose.
#
# If you run behind a load balancer that sets X-Forwarded-For, set
# MADRONA_TRUSTED_PROXIES to its subnet — the WHOLE directive, e.g.
#   MADRONA_TRUSTED_PROXIES="set_real_ip_from 10.0.0.0/16;"
# and nothing else, so an unset value leaves no trusted proxy at all.
# -----------------------------------------------------------------------------
${MADRONA_TRUSTED_PROXIES}
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# -----------------------------------------------------------------------------
# Real client scheme — trust X-Forwarded-Proto from the ALB. Falls back to
# $scheme when the header is absent (e.g. direct nginx access during dev).
# Used for emitting redirects so we never downgrade HTTPS → HTTP.
# -----------------------------------------------------------------------------
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https   https;
    http    http;
}

# HSTS only when the original request was HTTPS. Empty value = nginx skips
# emitting the header (nginx >=1.23 behavior), so local HTTP testing isn't
# accidentally pinned.
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains; preload";
}

# -----------------------------------------------------------------------------
# Main Application Server
# Serves frontend, proxies API, and serves authenticated documentation
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Suppress nginx version in Server header
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers — always means apply to error responses too.
    # X-XSS-Protection intentionally removed: deprecated and has caused XSS.
    #
    # WARNING: these are NOT inherited by any location that declares an
    # add_header of its own — nginx replaces the whole inherited set rather
    # than merging. Two locations below set Cache-Control, and because
    # `location /` internally redirects to /index.html, that meant the SPA
    # document and every static asset were served with no CSP, no
    # X-Frame-Options and no nosniff at all. Measured: /api returned 4
    # security headers and / returned 0. Any new location that sets a header
    # must repeat this block.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    # Content Security Policy — no unsafe-inline for scripts (primary XSS defense).
    # style-src keeps unsafe-inline for maplibre-gl and React CSSOM compatibility.
    # worker-src is spelled out because worker creation otherwise falls back to
    # script-src, and 'self' there forbids blob: — which is how maplibre-gl
    # starts its worker. Without this every map in the app failed with
    # "Creating a worker from 'blob:...' violates the following Content Security
    # Policy directive", so place authorities, loan networks, tour and shipment
    # routes and map search all rendered without a map. blob: is scoped to
    # workers only; script-src stays 'self'.
    # Held in a variable because it has to be repeated in every location that
    # declares an add_header of its own (see below); one copy avoids the two
    # drifting apart.
    set $madrona_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-src 'none'; worker-src 'self' blob:";
    add_header Content-Security-Policy $madrona_csp always;

    # Backend upstream, resolved per request rather than once at startup.
    #
    # With a literal hostname nginx resolves backend:8000 when it loads the
    # config and caches that address for the life of the worker. Recreate the
    # backend container afterwards — a rebuild, a compose up, a crash — and it
    # comes back on a new address while nginx keeps proxying to the old one,
    # so every API call, websocket handshake and login returns 502 until nginx
    # is restarted. Nothing about the backend is wrong, which makes it a
    # genuinely confusing first failure.
    #
    # A variable in the host position defers the lookup to request time and
    # honours the TTL below. Same reasoning as the object-store block further
    # down, which already did this.
    #
    # Because proxy_pass then carries a variable, the URI must be given
    # explicitly: $request_uri for the prefix locations that previously passed
    # the request through unchanged, and a literal path where one was already
    # written out.
    resolver ${MADRONA_RESOLVER} ipv6=off valid=30s;
    set $backend_upstream "backend:8000";

    # Internal auth validation endpoint used by the admin SPA
    location = /_auth/validate {
        internal;
        proxy_pass http://$backend_upstream/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        # $http_host, not $host: $host strips the port, so a stack published
        # on anything but :80 tells the backend a hostname it is not actually
        # reachable at. That breaks the Socket.IO same-origin check outright
        # and corrupts any absolute URL the backend builds from Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        # Pass cookies for refresh_token validation
        proxy_set_header Cookie $http_cookie;
    }




    # Admin chunk assets — auth-gated (audit H3). Must precede the generic
    # asset cache regex below; nginx picks the first matching regex.
    # NOTE: this must stay ahead of the static-asset regex below. nginx
    # takes the FIRST matching regex location, and object keys end in
    # .jpeg/.png/.svg — that rule would otherwise claim them and try to
    # serve them off local disk, returning 404 for every image.
    # Object storage, proxied same-origin.
    #
    # Presigned URLs are generated for THIS origin and forwarded here with
    # the path untouched, because SigV4/SigV2 sign the request path and the
    # Host header — rewrite either and the signature stops validating.
    # Path-style addressing puts the bucket first, so the bucket names are
    # the locations.
    #
    # Why proxy at all: a self-hosted object store is served over plain HTTP on its
    # own port, and the CSP here is "img-src 'self' data: https:". A direct
    # http://host:9000 image URL is cross-origin AND plain HTTP, so every
    # thumbnail was blocked. Same-origin satisfies 'self' with no CSP change.
    #
    # $s3_upstream is a variable on purpose: with a literal hostname nginx
    # resolves the upstream at startup and refuses to start where no such
    # host exists (any deployment backed by real S3 rather than the bundled store).
    # A variable defers resolution to request time, and on those
    # deployments presigned URLs point at S3 so this block is never hit.
    location ~ ^/(${MADRONA_MEDIA_BUCKET}|${MADRONA_PLATFORM_BUCKET})/ {
        set $s3_upstream "${MADRONA_S3_UPSTREAM}";
        proxy_pass $s3_upstream$request_uri;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Media is large and often range-requested; stream it rather than
        # buffering whole objects to disk.
        proxy_buffering off;
        proxy_read_timeout 300s;

        # The object store sets its own caching and content headers; don't
        # layer this server's HTML-oriented security headers onto binaries.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # This used to gate ^/assets/admin- behind /_auth/validate, on the
    # assumption that a chunk whose filename starts with "admin-" belongs to
    # the admin SPA. A bundler does not work that way. Vite names a chunk
    # after a module in it, and lib/api/admin is imported by an ordinary
    # collections page, so the build emits several admin-*.js files of which
    # only one is the admin entry — the others are shared chunks the main app
    # shell imports. Gating them returned a 302 to the login page with an HTML
    # body where a module was expected, the import graph failed, and the whole
    # application fell into its provider error boundary. A signed-out visitor
    # could not reach /login, because /login needs the shell too.
    #
    # The gate is not restored here because the filename is not a boundary:
    # chunk names change whenever the module graph does, so this breaks again
    # the moment something else gets grouped under that prefix. Nor is much
    # lost — the bundle is code, not data, and every admin route and API is
    # authorized server-side. If the boundary is wanted back, give the admin
    # SPA its own asset directory in the Vite config and gate that path, which
    # is a real boundary rather than a guess about naming.

    # Cache static assets for main app
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated deliberately. nginx does NOT inherit add_header into a
        # block that declares its own, so every directive set at server level
        # is dropped here — see the note above the server-level block.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy $madrona_csp always;
    }

    # Socket.IO — real-time updates. The backend mounts it via
    # socketio.ASGIApp at /socket.io/, but without a location here the
    # handshake falls through to the SPA catch-all and the browser gets
    # HTML instead of a websocket, retrying forever.
    location /socket.io/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host, not $host: $host strips the port, so a stack published
        # on anything but :80 tells the backend a hostname it is not actually
        # reachable at. That breaks the Socket.IO same-origin check outright
        # and corrupts any absolute URL the backend builds from Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived connections: don't cut them at the default 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # $http_host, not $host: $host strips the port, so a stack published
        # on anything but :80 tells the backend a hostname it is not actually
        # reachable at. That breaks the Socket.IO same-origin check outright
        # and corrupts any absolute URL the backend builds from Host.
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;

        # FastAPI's SecurityHeadersMiddleware also emits these — strip the
        # upstream copy so the server-level add_header above isn't duplicated.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Public IIIF Image/Presentation API — anonymous by design, enforces
    # publish-to-expose in the backend (discoverable object + is_published
    # media only; see routers/media_iiif.py). NOT auth-gated, unlike the admin SPA
    # and /admin: external IIIF viewers and aggregators must reach it.
    location /iiif {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        # $http_host, not $host: $host strips the port, so a stack published
        # on anything but :80 tells the backend a hostname it is not actually
        # reachable at. That breaks the Socket.IO same-origin check outright
        # and corrupts any absolute URL the backend builds from Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Proxy auth requests to backend
    location /auth {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # $http_host, not $host: $host strips the port, so a stack published
        # on anything but :80 tells the backend a hostname it is not actually
        # reachable at. That breaks the Socket.IO same-origin check outright
        # and corrupts any absolute URL the backend builds from Host.
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;

        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Admin SPA — auth-gated (audit H3). Uses /_auth/validate above.
    location /admin {
        auth_request /_auth/validate;
        auth_request_set $auth_status $upstream_status;
        error_page 401 403 = @admin_login_redirect;

        try_files $uri $uri/ /admin.html;
    }

    # Redirect to login for unauthenticated admin access
    location @admin_login_redirect {
        # $http_host, not $host: $host drops the port, so on any stack not
        # published on :80 this redirects to a different origin than the one
        # the browser is on — the asset then fails the page's CSP as
        # cross-origin and the app renders a broken state instead of a
        # sign-in page.
        return 302 $client_scheme://$http_host/login?redirect=$client_scheme://$http_host$request_uri;
    }

    # The app shell must never be cached. Asset filenames are content-hashed
    # and served immutable for a year, and a build deletes the previous ones,
    # so a stale index.html asks for chunks that no longer exist: the dynamic
    # import fails and the app falls into its provider error boundary
    # ("Some Features Unavailable") until a hard reload. Revalidating the
    # shell on every load is what keeps a deploy from breaking open tabs.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Repeated deliberately. nginx does NOT inherit add_header into a
        # block that declares its own, so every directive set at server level
        # is dropped here — see the note above the server-level block.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy $madrona_csp always;
    }

    # SPA fallback - serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
